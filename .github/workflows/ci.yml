name: Continuous Integration & Production Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build & Validate Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit Test Suite
        run: npx vitest run

      - name: Run Release Candidate Validation Report
        run: node scripts/release-candidate-report.cjs

      - name: Upload Release Candidate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-report
          path: RELEASE_CANDIDATE_REPORT.txt
          if-no-files-found: ignore
